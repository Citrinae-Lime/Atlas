---
title: Minimize Mouse Hover Time for Item Info
description: Minimizes mouse hover time (from 400 ms to 200 ms) for hovering over files or folders mostly in File Explorer, so that you can instantly see information for QoL
actions:
  - !registryValue:
    path: 'HKCU\Control Panel\Desktop'
    value: 'MouseHoverTime'
    data: '200'
    type: REG_SZ
    scope: defaultUser
    
